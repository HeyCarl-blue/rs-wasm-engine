[package]
name = "ruwr"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen = "0.2.114"
glam = "0.32.1"
js-sys = "0.3.94"

ruwr_ecs    = { path = "ecs" }
ruwr_macros = { path = "macros" }

[dependencies.web-sys]
version = "0.3.91"
features = [
  "console",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "Window",
  "Performance",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject"
]

[features]
default = ["dep:console_error_panic_hook"]

[dev-dependencies]
wasm-bindgen-test = "0.3.64"
