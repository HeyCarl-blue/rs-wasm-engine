<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #labels {display: flex; flex-direction: column; position: absolute; color: white; background-color: black;}
    </style>
</head>
<body>
    <div id="labels">
        <p id="fps-label"></p>
        <p id="playing-label"></p>
        <p id="position-label"></p>
    </div>
    
    <canvas id="canvas"></canvas>
    <script type="module">
        import init, {
            Engine,
            SphereMesh,
            SceneObject,
            Transform,
            LambertianMaterial,
            ColorRGB,
            ColorRGBA,
            Vector3,
            Quaternion,
            Rigidbody,
            SphereCollider,
        } from './pkg/ruwr.js';

        await init();

        const keysDown          = new Set();
        const keysJustPressed   = new Set();
        const keysJustReleased  = new Set();

        const mouse = { x: 0, y: 0, dx: 0, dy: 0 };
        const mouseDown         = new Set();
        const mouseJustPressed  = new Set();
        const mouseJustReleased = new Set();

        let yaw   = 0;
        let pitch = 0;
        const LOOK_SENSITIVITY = 0.002;

        const fpsLabel = document.getElementById('fps-label');
        const playingLabel = document.getElementById('playing-label');
        const positionLabel = document.getElementById('position-label');

        const canvas = document.getElementById('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('keydown', e => {
            if (!keysDown.has(e.code)) keysJustPressed.add(e.code);
            keysDown.add(e.code);
        });
        window.addEventListener('keyup', e => {
            keysDown.delete(e.code);
            keysJustReleased.add(e.code);
        });
        window.addEventListener('mouseup', e => {
            mouseDown.delete(e.button);
            mouseJustReleased.add(e.button);
        });

        canvas.addEventListener('mousedown', e => {
            if (!mouseDown.has(e.button)) mouseJustPressed.add(e.button);
            mouseDown.add(e.button);
        });
        canvas.addEventListener('mouseup', e => {
            mouseDown.delete(e.button);
            mouseJustReleased.add(e.button);
        });
        canvas.addEventListener('mousemove', e => {
            mouse.x  = e.offsetX;
            mouse.y  = e.offsetY;
            mouse.dx += e.movementX;
            mouse.dy += e.movementY;
        });
        canvas.addEventListener('click', () => canvas.requestPointerLock());

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === canvas) {
                console.log(mouse);
            }
        });

        const engine = new Engine('canvas');
        const scene  = engine.scene();
        engine.setDebug(true);

        new ResizeObserver(entries => {
            const { width, height } = entries[0].contentRect;
            canvas.width = width;
            canvas.height = height;
            engine.resize(width, height);
        }).observe(canvas);

        scene.setAmbientLight(ColorRGB.fromHex('aaaaaa'));

        const camera = scene.addCamera3D(new Vector3(0, 0, 10), 30, 0.1, 1000.0);
        const cameraTransform = camera.getTransform();

        const red  = new LambertianMaterial(new ColorRGB(1, 0, 0));
        const blue = new LambertianMaterial(new ColorRGB(0, 0, 1));

        const ta = new Transform(new Vector3(-1.5, 0, 0));
        const tb = new Transform(new Vector3( 1.5, 0, 0));

        const ma = new SphereMesh(100, 100);
        const mb = new SphereMesh(8, 8);

        const a = new SceneObject(scene, true);
        const b = new SceneObject(scene, true);

        ta.attachTo(a);
        ma.attachTo(a);
        red.attachTo(a);

        tb.attachTo(b);
        mb.attachTo(b);
        blue.attachTo(b);

        new Rigidbody(1.0, false).attachTo(a);
        new Rigidbody(1.0, false).attachTo(b);

        const collA = new SphereCollider(true, 1.0);
        collA.attachTo(a);
        collA.onCollision(result => {
            console.log(`${a.id()} collided with entity ${result.getOtherId()}, trigger: ${result.isTrigger()}`);
        })
        const collB = new SphereCollider(true, 1.0);
        collB.attachTo(b);

        function handleInput (engine, dt) {
            // if (mouseDown.has(0)) {
                
            // }

            if (document.pointerLockElement === canvas) {
                yaw   -= mouse.dx * LOOK_SENSITIVITY;
                pitch -= mouse.dy * LOOK_SENSITIVITY;
                pitch  = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));

                const qYaw   = Quaternion.from_axis_angle(new Vector3(0, 1, 0), yaw);
                const qPitch = Quaternion.from_axis_angle(new Vector3(1, 0, 0), pitch);
                cameraTransform.setRotation(qYaw.multiply(qPitch));
            }

            if (keysDown.has('KeyW'))  {
                const f = cameraTransform.forward();
                cameraTransform.translate(new Vector3 ( f.x * dt, f.y * dt, f.z * dt) );
            }
            if (keysDown.has('KeyS'))  {
                const b = cameraTransform.back();
                cameraTransform.translate(new Vector3 ( b.x * dt, b.y * dt, b.z * dt) );
            }
            if (keysDown.has('KeyA'))  {
                const l = cameraTransform.left();
                cameraTransform.translate(new Vector3 ( l.x * dt, l.y * dt, l.z * dt) );
            }
            if (keysDown.has('KeyD'))  {
                const r = cameraTransform.right();
                cameraTransform.translate(new Vector3 ( r.x * dt, r.y * dt, r.z * dt) );
            }

            if (keysJustPressed.has('Space')) engine.togglePlaying();
        }

        function loop() {
            engine.nextFrame();
            const dt = engine.deltaTime();

            fpsLabel.textContent = `${(1.0 / dt).toFixed(2)} fps`;
            playingLabel.textContent = `${engine.isPlaying() ? 'playing' : 'paused'}`;
            positionLabel.textContent = `camera pos: ${cameraTransform.getPosition()}`;

            if (engine.isPlaying()) {
                // console.log(`${ta.getPosition().sub(tb.getPosition())}`);
                let posDiff = ta.getPosition().sub(tb.getPosition());
                ta.translate(posDiff.mul(-dt));
                tb.translate(posDiff.mul(dt));
            }

            handleInput(engine, dt);

            mouse.dx = 0;
            mouse.dy = 0;
            mouseJustPressed.clear();
            mouseJustReleased.clear();
            keysJustPressed.clear();
            keysJustReleased.clear();

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

    </script>
</body>
</html>
