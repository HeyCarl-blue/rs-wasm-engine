<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script type="module">
        import init, { Engine, ColorRGB, ColorRGBA, Vector3 } from './pkg/ruwr.js';

        await init();

        const canvas = document.getElementById('canvas');
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;

        const engine = new Engine('canvas');

        new ResizeObserver(entries => {
            const { width, height } = entries[0].contentRect;
            canvas.width = width;
            canvas.height = height;
            engine.resize(width, height);
        }).observe(canvas);

        engine.set_ambient_light(ColorRGB.from_hex('aaaaaa'));


        const camera = engine.add_camera_2d(new Vector3(0, 0, 0), 100);
        engine.make_camera_active(camera);

        engine.add_lambertian_sphere(new Vector3(0, 0, 0), new ColorRGB(0.6, 0.2, 0.6), 16, 16);

        const sphere = engine.create_sphere_mesh(32, 32);
        const red    = engine.create_lambertian_material(new ColorRGB(1, 0, 0));
        const blue   = engine.create_lambertian_material(new ColorRGB(0, 0, 1));

        const curve = engine.create_bezier_mesh(
        new Vector3(-3,  0, 0),
        new Vector3(-1,  3, 0),
        new Vector3( 1, -3, 0),
        new Vector3( 3,  0, 0),
        0.05,
        32
    );

    const orange = engine.create_lambertian_material(ColorRGB.from_hex("#ff6600"));
    engine.spawn_object(curve, orange, new Vector3(0, 0, 0));

        engine.spawn_object(sphere, red,  new Vector3(-2, 0, 0));
        engine.spawn_object(sphere, blue, new Vector3( 2, 0, 0));

        function loop(timestamp) {
            engine.clear(ColorRGBA.from_hex('222222'));
            engine.next_frame(timestamp);
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
